<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me | Aabhas Tripathi</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="components/navbar.js" defer></script>
  <script src="components/footer.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <custom-navbar></custom-navbar>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <h1 class="text-4xl font-bold text-center mb-12">Get in Touch</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      <!-- Social -->
      <section class="bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6">Connect With Me</h2>
        <div class="space-y-4">
          <a href="#" class="flex items-center gap-3 text-indigo-600 hover:text-indigo-800 transition">
            <i data-feather="linkedin" class="w-5 h-5"></i><span>LinkedIn</span>
          </a>
          <a href="#" class="flex items-center gap-3 text-indigo-600 hover:text-indigo-800 transition">
            <i data-feather="github" class="w-5 h-5"></i><span>GitHub</span>
          </a>
          <a href="#" class="flex items-center gap-3 text-indigo-600 hover:text-indigo-800 transition">
            <i data-feather="instagram" class="w-5 h-5"></i><span>Instagram</span>
          </a>
          <a href="mailto:contact@example.com" class="flex items-center gap-3 text-indigo-600 hover:text-indigo-800 transition">
            <i data-feather="mail" class="w-5 h-5"></i><span>Email</span>
          </a>
          <a href="#" class="flex items-center gap-3 text-indigo-600 hover:text-indigo-800 transition">
            <i data-feather="twitter" class="w-5 h-5"></i><span>Twitter</span>
          </a>
        </div>
      </section>

      <!-- Form -->
      <section class="bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6">Send a Message</h2>
        <form id="contact-form" class="space-y-5" onsubmit="return false;">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
            <input id="name" type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"/>
          </div>
          <div>
            <label for="purpose" class="block text-sm font-medium text-gray-700 mb-1">Purpose of Visit</label>
            <input id="purpose" type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"/>
          </div>
          <div>
            <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
            <input id="contact" type="tel" pattern="[0-9+\-\s]{7,}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="+91 98765 43210"/>
          </div>

          <button type="submit" class="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
            Submit
          </button>

          <p id="form-status" class="text-sm text-green-600 hidden mt-2">Thanks! I'll get back to you soon.</p>
        </form>
      </section>
    </div>
  </main>

  <custom-footer></custom-footer>

  <script>
    feather.replace();
  </script>
  <script src="script.js"></script>
  <script>
document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    purpose: document.getElementById("purpose").value,
    contact: document.getElementById("contact").value
  };

  const res = await fetch("http://localhost:5000/save-contact", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (res.ok) {
    alert("✅ Message saved!");
    e.target.reset();
  } else {
    alert("❌ Error: " + result.error);
  }
});
</script>

</body>
</html>
